<header class="site-header">

<div class="container">

    </section>

    <!-- cateogry filter bar -->
<div class="toolbar category-bar">
    <div class="category-select=wrap">
        <label for="categorySelect" class="visually-hidden">Category:</label>
        <select id="categorySelect" class="form-control category-select" aria-label="Filter by category">

            <option value="All">All</option>
            <option value="Figurines">Figurines</option>
            <option value="Toys">Toys</option>
            <option value="Board Games">Board games</option>
            <option value="Diecast Cars">Diecast</option>
             </select>
            </div>
<div class="filter-buttons">
   <button class="filter-btn active" data-category="All">All</button>
   <button class="filter-btn" data-category="Figurines">Figurines</button>
   <button class="filter-btn" data-category="Toys">Toys</button>
   <button class="filter-btn" data-category="Board Games">Board Games</button>
   <button class="filter-btn" data-category="Diecast Cars">Diecast</button>
</div>

<!--Product grid -->
<div class="product-grid" id="productGrid"></div>
</div>

<div class="modal" id="productModal"><div class="modal-box"><button class="close"></button>
    <div class="modal-content"></div>
  </div>
